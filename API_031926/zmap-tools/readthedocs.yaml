# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version, and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

# Build documentation in the "docs/" directory with Sphinx
sphinx:
  configuration: docs/conf.py

# Install only the docs build requirements.
# The zmap package itself is NOT pip-installed here — conf.py adds
# src/ to sys.path and autodoc_mock_imports handles the heavy
# scientific dependencies (anndata, scanpy, scipy, etc.), so
# Sphinx can generate API docs without installing the full stack.
python:
  install:
    - requirements: docs/requirements.txt
