[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zmap-tools"
version = "0.2.2.1"
description = "API for working with ZMAP (Zebrafish Multi-Atlas Project)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

authors = [
  { name = "Daniel Wagner", email = "Daniel.Wagner@ucsf.edu" }
]

keywords = ["single-cell", "zebrafish", "rna-seq", "reference atlas", "scanpy"]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "anndata==0.12.18",
  "scanpy==1.12.1",

  "numpy==2.0.2",
  "numba==0.60.0",
  "llvmlite==0.43.0",

  "pandas>=2.0,<3.0",
  "matplotlib>=3.7,<4.0",
  "requests>=2.31",
  "scipy==1.16.3",
  "scikit-learn==1.6.1",
  "faiss-cpu==1.14.3",
  "seaborn==0.13.2",
  "tqdm>=4.66",
  "adjustText>=0.8",
  "symphonypy==0.2.4",
  "igraph==1.0.0",
  "leidenalg==0.12.0",
]

[project.urls]
Homepage = "https://github.com/WagnerLabUCSF/zmap-tools"
Documentation = "https://zmap-tools.readthedocs.io"
Issues = "https://github.com/WagnerLabUCSF/zmap-tools/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
