[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zmap-tools"
version = "0.2.2"
description = "API for working with ZMAP (Zebrafish Multi-Atlas Project)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

authors = [
  { name = "Daniel Wagner", email = "Daniel.Wagner@ucsf.edu" }
]

keywords = ["single-cell", "zebrafish", "rna-seq", "reference atlas", "scanpy"]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "anndata>=0.10",
  "scanpy>=1.9",
  "numpy>=1.24",
  "pandas>=2.0,<3.0",
  "matplotlib>=3.7",
  "requests>=2.31",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "faiss-cpu>=1.8",
  "seaborn>=0.12",
  "tqdm>=4.66",
  "adjustText>=0.8",
  "symphonypy>=0.2",
]

[project.urls]
Homepage = "https://github.com/WagnerLabUCSF/zmap-tools"
Documentation = "https://zmap-tools.readthedocs.io"
Issues = "https://github.com/WagnerLabUCSF/zmap-tools/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
