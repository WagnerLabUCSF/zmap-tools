[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zmap-tools"
version = "0.2.2.1"
description = "API for working with ZMAP (Zebrafish Multi-Atlas Project)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

authors = [
  { name = "Daniel Wagner", email = "Daniel.Wagner@ucsf.edu" }
]

keywords = ["single-cell", "zebrafish", "rna-seq", "reference atlas", "scanpy"]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "numpy==2.2.6",
  "numba==0.65.1",
  "llvmlite>=0.47,<0.48",
  "scanpy==1.12.2",
  "anndata>=0.10,<0.13",

  "pandas>=2.0,<3.0",
  "scipy>=1.10,<2.0",
  "scikit-learn>=1.3,<2.0",
  "matplotlib>=3.7,<4.0",
  "seaborn>=0.12,<0.14",

  "requests>=2.31",
  "tqdm>=4.66",
  "adjustText>=0.8",
  "faiss-cpu>=1.8,<2.0",
  "symphonypy>=0.2,<0.3",
  "igraph>=1.0.0",
  "leidenalg>=0.12.0",
]

[project.urls]
Homepage = "https://github.com/WagnerLabUCSF/zmap-tools"
Documentation = "https://zmap-tools.readthedocs.io"
Issues = "https://github.com/WagnerLabUCSF/zmap-tools/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
