[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zmap-tools"
version = "0.2.2.3"
description = "API for working with ZMAP (Zebrafish Multi-Atlas Project)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

authors = [
  { name = "Daniel Wagner", email = "Daniel.Wagner@ucsf.edu" }
]

keywords = ["single-cell", "zebrafish", "rna-seq", "reference atlas", "scanpy"]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

dependencies = [
  "anndata>=0.12.18,<0.14",
  "scanpy>=1.12.1,<1.13",

  "numpy>=2.1,<3",
  "numba>=0.64",

  "pandas>=2.2,<3",
  "matplotlib>=3.7,<4",
  "requests>=2.31",
  "scipy>=1.15,<2",
  "scikit-learn>=1.6,<2",
  "faiss-cpu>=1.14.3,<2",
  "seaborn>=0.13.2,<0.14",
  "tqdm>=4.66",
  "adjustText>=0.8",
  "symphonypy>=0.2.4,<0.3",
  "igraph>=1.0,<2",
  "leidenalg>=0.12,<0.13",
  "joblib>=1.3",
  "h5py>=3.0",
  "torch>=2.0",
  "lightgbm>=4.0",
]

[project.urls]
Homepage = "https://github.com/WagnerLabUCSF/zmap-tools"
Documentation = "https://zmap-tools.readthedocs.io"
Issues = "https://github.com/WagnerLabUCSF/zmap-tools/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zmap = [
  "predict/baseline2_file/**/*",
]
